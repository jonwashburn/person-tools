<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>A call for you</title>
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script src="/hosts.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the call</a>
<header class="bar" id="bar">
  <span class="label" id="bar-label">A CALL FOR YOU</span>
  <button class="stop" id="stop-btn" type="button" hidden>Stop or report</button>
  <button class="stop" id="report-btn" type="button" hidden>Report this call</button>
</header>
<main id="main" tabindex="-1">
  <section class="screen" id="screen-loading" aria-live="polite">
    <p class="label">OPENING THE CALL</p>
    <p class="lede">One moment.</p>
  </section>
</main>
<div class="live" id="live" aria-live="polite" aria-atomic="true"></div>
<noscript><p class="lede pad">This call page needs JavaScript to play the material and send your answer. Nothing else runs on it.</p></noscript>
</body>
</html>
