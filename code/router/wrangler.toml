# askpeople-api (Pages + Functions). Deployed only by bin/golive askpeople-api from a build copy of this folder.
name = "askpeople-api"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "askpeople-db"
database_id = "7412c10d-cfe9-4883-91bb-0c949aad8206"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "askpeople-media"

# plain settings (not secrets): with this file Cloudflare ignores plain variables set in the dashboard, so they live here
[vars]
APNS_TOPIC = "tools.person.app"
